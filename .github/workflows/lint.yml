name: Lint & Static Checks

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  lint:
    name: ruff + import-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (lint)
        run: |
          # Lint somente o pacote app/, não testes
          # Modo lenient: apenas erros críticos (E9, F63, F7, F82)
          # Bug-causing only — não estilísticos.
          ruff check app/ --select=E9,F63,F7,F82 --no-cache || \
            (echo "::warning::ruff lint failed, mas não bloqueia merge"; true)

      - name: Run ruff (format check, dry-run)
        run: |
          ruff format app/ --check --diff || \
            (echo "::warning::format diffs detected"; true)
        continue-on-error: true

  imports:
    name: import smoke (sem GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install minimal deps (sem PySide6)
        run: |
          python -m pip install --upgrade pip
          # Apenas cores: numpy, sem Qt
          pip install numpy
      - name: Smoke import (preprocessor + standards)
        run: |
          python -c "import app.standards.iec60909"
          python -c "import app.standards.iec60909_seq"
          python -c "import app.standards.iec60909_decay"
          python -c "import app.standards.iec60909_kappa"
          python -c "import app.standards.nbr17227"
          python -c "import app.standards.iec60255"
          python -c "import app.preprocessor.atp_format"
          python -c "import app.postprocessor.short_circuit"
          python -c "import app.postprocessor.power_flow"
          python -c "import app.postprocessor.motor_starting"
          python -c "import app.postprocessor.arc_flash"
          python -c "import app.postprocessor.relay_coordination"
          echo "✓ Todos os módulos core importam sem PySide6"
