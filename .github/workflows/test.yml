name: Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Pytest on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system Qt deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-cursor0 \
            libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Run pytest with coverage
        # Subset CI-safe — sweep completo (5568 testes) inclui testes legacy
        # que abrem QDialog modal (dlg.exec()) sem mock; em headless CI esses
        # ficam em deadlock no Qt event loop e --timeout-method=thread não
        # consegue interromper (Qt detém a GIL no exec()). Rodamos aqui apenas:
        #   - Sprints commercial (v4.1.x) — 1+2+3+4+5 sprints
        #   - Readiness v4.0.0-beta
        #   - Módulos com decoradores @requires_feature (audit_trail, MC×3,
        #     report_html) — provam que os gates não quebraram funcionalidade
        #   - Commercial legacy (v2.0.0)
        # Para sweep total: rodar localmente com `pytest tests/` em ambiente
        # com display real ou Xvfb.
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m pytest \
            tests/test_pp_v4_1_0_commercial_sprint1.py \
            tests/test_pp_v4_1_0_commercial_sprint2.py \
            tests/test_pp_v4_1_0_commercial_sprint3.py \
            tests/test_pp_v4_1_0_commercial_sprint4.py \
            tests/test_pp_v4_1_0_commercial_sprint5.py \
            tests/test_pp_v4_0_0_beta_readiness.py \
            tests/test_pp_v2_0_0_commercial.py \
            tests/test_pp_v0_92_audit_trail.py \
            tests/test_pp_report_html.py \
            tests/test_pp_v0_44_monte_carlo.py \
            tests/test_pp_v0_80_pf_monte_carlo.py \
            tests/test_pp_v3_8_0_reliability_mc.py \
            --cov=app.commercial \
            --cov=app.postprocessor.audit_trail \
            --cov=app.postprocessor.report_html \
            --cov=app.postprocessor.reliability_monte_carlo \
            --cov=app.postprocessor.arc_flash_monte_carlo \
            --cov=app.postprocessor.power_flow_monte_carlo \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --timeout=60 \
            --timeout-method=thread \
            --tb=short \
            -q

      - name: Upload coverage to Codecov (Ubuntu only)
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            **/*.log
            tests/**/__pycache__
          retention-days: 5
